<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeep Militar Game</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚙</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1b122c;
            color: #fff;
            font-family: 'Fredoka One', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 2 / 1;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            border: 4px solid #4d662b;
            border-radius: 15px;
            overflow: hidden;
            background: #87ceeb;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: clamp(14px, 4vw, 22px);
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
            pointer-events: none;
            z-index: 10;
        }

        #instructions {
            margin-top: 10px;
            text-align: center;
            font-size: clamp(11px, 2.2vw, 15px);
            color: #b3d9ff;
            text-shadow: 1px 1px 2px #000;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 12px;
            border-radius: 10px;
            border: 2px solid #4d662b;
            max-width: 800px;
            width: 95%;
            line-height: 1.4;
        }

        #mobile-controls {
            display: none;
            width: 100%;
            max-width: 800px;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 15px;
        }

        .left-control {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .right-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .right-row {
            display: flex;
            gap: 6px;
        }

        .btn-ctrl {
            background: #556b2f;
            border: 3px solid #000;
            color: #fff;
            font-family: 'Fredoka One', cursive;
            font-size: 15px;
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 0 #2e3b19;
            cursor: pointer;
            outline: none;
        }

        .btn-large {
            padding: 18px 24px;
            font-size: 18px;
            background: #4a6b22;
        }

        .btn-ctrl:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2e3b19;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 20px;
        }

        #start-screen h1 {
            color: #ffcc00;
            font-size: clamp(24px, 5vw, 42px);
            text-shadow: 3px 3px #000;
            margin: 0;
            text-align: center;
        }

        #btnStartGame {
            background: #2ecc71;
            border: 4px solid #000;
            color: #fff;
            font-family: 'Fredoka One', cursive;
            font-size: 22px;
            padding: 15px 35px;
            border-radius: 15px;
            box-shadow: 0 6px 0 #1b7943;
            cursor: pointer;
            outline: none;
        }

        #btnStartGame:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #1b7943;
        }

        #orientation-alert {
            font-size: 13px;
            color: #ff3333;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
        }

        @media (max-width: 900px), (pointer: coarse) {
            #mobile-controls {
                display: flex;
            }
            body {
                justify-content: flex-start;
                padding-top: 5px;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="start-screen">
            <h1>MOON PATROL - JEEP</h1>
            <div id="orientation-alert">📱 Posição do Celular: Retrato</div>
            <button id="btnStartGame">INICIAR JOGO</button>
        </div>

        <div id="ui">
            <div>⭐ PONTOS: <span id="scoreVal">0</span></div>
            <div>⚡ STATUS: <span id="statusVal" style="color: #00ffcc;">AGUARDANDO</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>
    
    <div id="instructions">
        🎮 **Como Jogar:** Salte sobre buracos e obstáculos terrestres, desvie ou destrua os inimigos disparando para a frente ou para cima. Você pode **atirar enquanto pula**!
    </div>

    <div id="mobile-controls">
        <div class="left-control">
            <button class="btn-ctrl btn-large" id="btnJump">⬆ PULAR</button>
        </div>
        <div class="right-control">
            <button class="btn-ctrl" id="btnShootUp">⬆ TIRO CIMA</button>
            <div class="right-row">
                <button class="btn-ctrl" id="btnShoot">➡ TIRO FRENTE</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreVal = document.getElementById('scoreVal');
        const statusVal = document.getElementById('statusVal');
        const startScreen = document.getElementById('start-screen');
        const btnStartGame = document.getElementById('btnStartGame');
        const orientationAlert = document.getElementById('orientation-alert');

        let gameStarted = false;
        let score = 0;
        let gameOver = false;
        let gameSpeed = 4;
        let distanceTraveled = 0;

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                orientationAlert.innerText = "📱 Posição: Retrato (Vertical) - Vire na horizontal para melhor experiência";
                orientationAlert.style.color = "#ffcc00";
            } else {
                orientationAlert.innerText = "📱 Posição: Paisagem (Horizontal) - Perfeito!";
                orientationAlert.style.color = "#00ffcc";
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyR' && gameOver) {
                resetGame();
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        const btnJump = document.getElementById('btnJump');
        const btnShoot = document.getElementById('btnShoot');
        const btnShootUp = document.getElementById('btnShootUp');

        function setupTouchButton(btn, keyCode) {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyCode] = true; if(keyCode === 'KeyR' && gameOver) resetGame(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyCode] = false; });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[keyCode] = true; if(keyCode === 'KeyR' && gameOver) resetGame(); });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[keyCode] = false; });
        }

        setupTouchButton(btnJump, 'Space');
        setupTouchButton(btnShoot, 'ArrowRight');
        setupTouchButton(btnShootUp, 'ArrowUp');

        btnStartGame.addEventListener('click', () => {
            startScreen.style.display = 'none';
            gameStarted = true;
            resetGame();
        });

        const rover = {
            x: 100,
            y: 280,
            width: 65,
            height: 40,
            vy: 0,
            gravity: 0.55,
            jumpForce: -11,
            isJumping: false,
            isFallingInPit: false,
            fallRotation: 0,
            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                
                if (this.isFallingInPit) {
                    this.fallRotation += 0.15;
                    ctx.rotate(this.fallRotation);
                    ctx.scale(Math.max(0, 1 - (this.fallRotation / 2.5)), Math.max(0, 1 - (this.fallRotation / 2.5)));
                }

                ctx.fillStyle = '#556b2f';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                
                ctx.beginPath();
                ctx.roundRect(-30, -5, 60, 22, 4);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#3a4d1e';
                ctx.beginPath();
                ctx.moveTo(-15, -5);
                ctx.lineTo(-5, -20);
                ctx.lineTo(20, -20);
                ctx.lineTo(25, -5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#87ceeb';
                ctx.beginPath();
                ctx.moveTo(-12, -7);
                ctx.lineTo(-4, -18);
                ctx.lineTo(17, -18);
                ctx.lineTo(22, -7);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#222';
                ctx.fillRect(5, -28, 22, 5);
                ctx.strokeRect(5, -28, 22, 5);

                ctx.fillStyle = '#fff';
                ctx.fillRect(25, 2, 14, 5);
                ctx.strokeRect(25, 2, 14, 5);

                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(-20, 17, 10, 0, Math.PI * 2);
                ctx.arc(20, 17, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(-20, 17, 4, 0, Math.PI * 2);
                ctx.arc(20, 17, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            },
            update() {
                if (this.isFallingInPit) {
                    this.y += 4;
                    return;
                }

                this.vy += this.gravity;
                this.y += this.vy;

                const groundLevel = 320 - this.height;
                if (this.y > groundLevel) {
                    this.y = groundLevel;
                    this.vy = 0;
                    this.isJumping = false;
                }
            },
            jump() {
                if (!this.isJumping && !this.isFallingInPit) {
                    this.vy = this.jumpForce;
                    this.isJumping = true;
                }
            }
        };

        let bullets = [];
        let enemyBullets = [];
        let lastShotTime = 0;

        function shoot(upward) {
            if (rover.isFallingInPit || gameOver || !gameStarted) return;
            const now = Date.now();
            if (now - lastShotTime > 150) {
                bullets.push({
                    x: upward ? rover.x + 25 : rover.x + 40,
                    y: upward ? rover.y - 15 : rover.y + 10,
                    vx: upward ? 0 : 16,
                    vy: upward ? -16 : 0,
                    width: upward ? 6 : 14,
                    height: upward ? 14 : 6,
                    upward: upward
                });
                lastShotTime = now;
            }
        }

        let obstacles = [];
        let obstacleTimer = 0;

        function spawnObstacle() {
            const types = ['rock', 'log', 'pit', 'ship'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            let obs = {
                type: type,
                x: canvas.width,
                width: 35,
                height: 30,
                y: 290,
                shipAngle: 0,
                canShoot: type === 'ship' && Math.random() < 0.5,
                shootTimer: 0,
                shootInterval: 70 + Math.random() * 50
            };

            if (type === 'pit') {
                obs.width = 75;
                obs.height = 12;
                obs.y = 320;
            } else if (type === 'log') {
                obs.width = 45;
                obs.height = 24;
                obs.y = 296;
            } else if (type === 'rock') {
                obs.width = 34;
                obs.height = 28;
                obs.y = 292;
            } else if (type === 'ship') {
                obs.width = 45;
                obs.height = 22;
                obs.y = 130 + Math.random() * 50;
            }

            obstacles.push(obs);
        }

        let clouds = Array.from({ length: 5 }, (_, i) => ({
            x: i * 180 + Math.random() * 40,
            y: 30 + Math.random() * 40,
            speed: 0.5
        }));

        let farMountains = Array.from({ length: 4 }, (_, i) => ({
            x: i * 220,
            y: 190,
            width: 250,
            speed: 0.8
        }));

        let closeHills = Array.from({ length: 4 }, (_, i) => ({
            x: i * 250,
            y: 250,
            width: 280,
            speed: 1.5
        }));

        let sceneryBushes = Array.from({ length: 6 }, (_, i) => ({
            x: i * 160 + Math.random() * 50,
            y: 305,
            speed: 4
        }));

        function resetGame() {
            score = 0;
            distanceTraveled = 0;
            gameOver = false;
            obstacles = [];
            bullets = [];
            enemyBullets = [];
            gameSpeed = 4;
            rover.y = 280;
            rover.vy = 0;
            rover.isFallingInPit = false;
            rover.fallRotation = 0;
            statusVal.innerText = "NA PISTA";
            statusVal.style.color = "#00ffcc";
            loop();
        }

        function loop() {
            if (!gameStarted) {
                drawScene();
                return;
            }

            if (gameOver && (rover.isFallingInPit ? rover.y > 450 : true)) {
                drawScene();
                drawGameOverScreen();
                return;
            }

            if (!rover.isFallingInPit) {
                distanceTraveled += gameSpeed;
                score = Math.floor(distanceTraveled / 10);
                scoreVal.innerText = score;
                gameSpeed = 4 + Math.floor(score / 200);

                if (keys['Space']) {
                    rover.jump();
                }

                if (keys['ArrowRight']) {
                    shoot(false);
                }

                if (keys['ArrowUp']) {
                    shoot(true);
                }
            }

            rover.update();

            if (!rover.isFallingInPit) {
                obstacleTimer++;
                if (obstacleTimer > Math.max(50, 110 - gameSpeed * 4)) {
                    spawnObstacle();
                    obstacleTimer = 0;
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].x -= gameSpeed;

                    if (obstacles[i].type === 'ship') {
                        obstacles[i].shipAngle += 0.08;
                        obstacles[i].y += Math.sin(obstacles[i].shipAngle) * 0.8;

                        if (obstacles[i].canShoot) {
                            obstacles[i].shootTimer++;
                            if (obstacles[i].shootTimer >= obstacles[i].shootInterval) {
                                obstacles[i].shootTimer = 0;
                                enemyBullets.push({
                                    x: obstacles[i].x + obstacles[i].width / 2,
                                    y: obstacles[i].y + obstacles[i].height,
                                    vx: -3,
                                    vy: 4,
                                    width: 6,
                                    height: 12
                                });
                            }
                        }
                    }

                    if (obstacles[i].x + obstacles[i].width < 0) {
                        obstacles.splice(i, 1);
                        continue;
                    }

                    let rx = rover.x + 10;
                    let ry = rover.y + 5;
                    let rw = rover.width - 20;
                    let rh = rover.height - 5;

                    let ox = obstacles[i].x;
                    let oy = obstacles[i].y;
                    let ow = obstacles[i].width;
                    let oh = obstacles[i].height;

                    if (obstacles[i].type === 'pit') {
                        let roverCenterX = rover.x + rover.width / 2;
                        if (roverCenterX > ox + 8 && roverCenterX < ox + ow - 8 && rover.y >= 280) {
                            rover.isFallingInPit = true;
                            gameOver = true;
                        }
                    } else {
                        if (rx < ox + ow && rx + rw > ox && ry < oy + oh && ry + rh > oy) {
                            gameOver = true;
                        }
                    }
                }

                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    enemyBullets[i].x += enemyBullets[i].vx;
                    enemyBullets[i].y += enemyBullets[i].vy;

                    if (enemyBullets[i].x < 0 || enemyBullets[i].y > 340) {
                        enemyBullets.splice(i, 1);
                        continue;
                    }

                    let rx = rover.x + 10;
                    let ry = rover.y + 5;
                    let rw = rover.width - 20;
                    let rh = rover.height - 5;

                    if (
                        enemyBullets[i].x < rx + rw &&
                        enemyBullets[i].x + enemyBullets[i].width > rx &&
                        enemyBullets[i].y < ry + rh &&
                        enemyBullets[i].y + enemyBullets[i].height > ry
                    ) {
                        enemyBullets.splice(i, 1);
                        gameOver = true;
                    }
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].x += bullets[i].vx;
                    bullets[i].y += bullets[i].vy;

                    if (bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > 320) {
                        bullets.splice(i, 1);
                        continue;
                    }

                    for (let j = obstacles.length - 1; j >= 0; j--) {
                        let obs = obstacles[j];
                        if (obs.type !== 'pit') {
                            let bLeft = bullets[i].x - 8;
                            let bRight = bullets[i].x + bullets[i].width + 8;
                            let bTop = bullets[i].y - 8;
                            let bBottom = bullets[i].y + bullets[i].height + 8;

                            let oLeft = obs.x - 6;
                            let oRight = obs.x + obs.width + 6;
                            let oTop = obs.y - 6;
                            let oBottom = obs.y + obs.height + 6;

                            if (bRight > oLeft && bLeft < oRight && bBottom > oTop && bTop < oBottom) {
                                obstacles.splice(j, 1);
                                bullets.splice(i, 1);
                                score += obs.type === 'ship' ? 100 : 50;
                                break;
                            }
                        }
                    }
                }
            }

            drawScene();

            if (gameOver && rover.isFallingInPit && rover.y <= 450) {
                requestAnimationFrame(loop);
            } else if (!gameOver) {
                requestAnimationFrame(loop);
            } else {
                drawGameOverScreen();
            }
        }

        function drawScene() {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#1E90FF');
            skyGrad.addColorStop(1, '#87CEEB');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            clouds.forEach(c => {
                if (!gameOver && gameStarted) {
                    c.x -= c.speed;
                    if (c.x < -100) c.x = canvas.width + 50;
                }
                ctx.beginPath();
                ctx.arc(c.x, c.y, 22, 0, Math.PI * 2);
                ctx.arc(c.x + 22, c.y - 12, 30, 0, Math.PI * 2);
                ctx.arc(c.x + 48, c.y, 24, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.fillStyle = '#4682B4';
            farMountains.forEach(m => {
                if (!gameOver && gameStarted) {
                    m.x -= m.speed;
                    if (m.x + m.width < 0) m.x = canvas.width;
                }
                ctx.beginPath();
                ctx.moveTo(m.x, 320);
                ctx.lineTo(m.x + m.width / 2, m.y);
                ctx.lineTo(m.x + m.width, 320);
                ctx.fill();
            });

            ctx.fillStyle = '#2E8B57';
            closeHills.forEach(h => {
                if (!gameOver && gameStarted) {
                    h.x -= h.speed;
                    if (h.x + h.width < 0) h.x = canvas.width;
                }
                ctx.beginPath();
                ctx.arc(h.x + h.width / 2, 320, h.width / 2, Math.PI, 0, false);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            ctx.fillStyle = '#228B22';
            sceneryBushes.forEach(b => {
                if (!gameOver && gameStarted) {
                    b.x -= gameSpeed;
                    if (b.x < -30) b.x = canvas.width + Math.random() * 50;
                }
                ctx.beginPath();
                ctx.arc(b.x, b.y, 12, 0, Math.PI * 2);
                ctx.arc(b.x + 10, b.y - 5, 15, 0, Math.PI * 2);
                ctx.arc(b.x + 20, b.y, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, 320, canvas.width, 80);
            ctx.fillStyle = '#32CD32';
            ctx.fillRect(0, 320, canvas.width, 12);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 320);
            ctx.lineTo(canvas.width, 320);
            ctx.stroke();

            obstacles.forEach(obs => {
                ctx.save();
                if (obs.type === 'pit') {
                    ctx.fillStyle = '#111';
                    ctx.fillRect(obs.x, obs.y, obs.width, 80);
                } else if (obs.type === 'rock') {
                    ctx.fillStyle = '#808080';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 6, obs.y + obs.height);
                    ctx.lineTo(obs.x, obs.y + 14);
                    ctx.quadraticCurveTo(obs.x + 4, obs.y, obs.x + 16, obs.y + 2);
                    ctx.quadraticCurveTo(obs.x + obs.width, obs.y - 2, obs.x + obs.width - 2, obs.y + 16);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 14, obs.y + 8);
                    ctx.lineTo(obs.x + 18, obs.y + 18);
                    ctx.stroke();
                } else if (obs.type === 'log') {
                    ctx.fillStyle = '#A0522D';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 6);
                    ctx.fill();
                    ctx.stroke();
                } else if (obs.type === 'ship') {
                    ctx.fillStyle = obs.canShoot ? '#ff33ff' : '#9933ff';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(obs.x + 22, obs.y + 10, 22, 11, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#00ffff';
                    ctx.beginPath();
                    ctx.arc(obs.x + 22, obs.y + 6, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.restore();
            });

            ctx.fillStyle = '#FFFF00';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y + 3, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            ctx.fillStyle = '#ff3333';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            enemyBullets.forEach(eb => {
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            rover.draw();
        }

        function drawGameOverScreen() {
            statusVal.innerText = "GAME OVER";
            statusVal.style.color = "#ff3333";

            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff3366';
            ctx.font = '36px "Fredoka One", cursive';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 4;
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 25);

            ctx.fillStyle = '#ffcc00';
            ctx.font = '20px "Fredoka One", cursive';
            ctx.fillText("APERTE R PARA RECOMEÇAR", canvas.width / 2, canvas.height / 2 + 20);
            ctx.shadowBlur = 0;
        }

        drawScene();
    </script>
</body>
</html>
